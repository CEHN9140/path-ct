llm:
  model_name: deepseek-v4-pro
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0
  max_new_tokens: 32768
  timeout: 120
  extra_body:
    thinking:
      type: disabled
  structured_output_retries: 3
  tool_selection_retries: 3
  verifier_audit_coverage_retries: 3
  router_plan_validation_retries: 3
  reviser_plan_validation_retries: 3
prompt_dir: /data/qijun/path-ct/agents/subtype_review/prompts
budget:
  max_rounds: 20
cross_modal:
  concordance:
    permutations: 999
    bootstrap_repeats: 1000
    random_seed: 20260921
  structural:
    max_children: 4
    min_child_size: 4
    nearest_merge_neighbors: 2
rna:
  hallmark_gene_sets_path: /data/qijun/path-ct/tools/msigdb/h.all.v2026.1.Hs.symbols.gmt
  reactome_gene_sets_path: /data/qijun/path-ct/tools/msigdb/c2.cp.reactome.v2026.1.Hs.symbols.gmt
  kegg_medicus_gene_sets_path: /data/qijun/path-ct/tools/msigdb/c2.cp.kegg_medicus.v2026.1.Hs.symbols.gmt
  min_pathway_overlap: 15
  cache_version: 1
  n_cpus: 4
  gsea_threads: 4
  gsea_permutations: 1000
known_label_echo:
  mrna_m1_m4_path: /data/qijun/path-ct/data/tcga_kirc_mrna_m1_m4.csv
  clearcode34_path: /data/qijun/path-ct/data/tcga_kirc_clearcode34.csv
  permutations: 999
confounder:
  permutations: 999
  random_seed: 20260921
