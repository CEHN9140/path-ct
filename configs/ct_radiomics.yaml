label: 1
remove_diagnostics: true
hu_clip_range: [-150.0, 250.0]
ccc_comparison_bin_widths: [20, 30]
ccc_threshold: 0.85
confound_correction:
  enabled: true
  fields:
    - ct_phase_group
    - ct_manufacturer
    - ct_scanner_model
    - ct_reconstruction_kernel
    - ct_slice_thickness

extractor:
  setting:
    binWidth: 25
    normalize: false
    correctMask: true
    geometryTolerance: 1.0e-6
    resampledPixelSpacing: [1.0, 1.0, 1.0]
    interpolator: sitkBSpline
  imageType:
    Original: {}
    LoG:
      sigma: [1.0, 2.0, 3.0]
    Wavelet: {}
  featureClass:
    shape: []
    firstorder: []
    glcm: []
    glrlm: []
    glszm: []
    gldm: []
    ngtdm: []
