candidate_ks: [2, 3, 4, 5, 6, 7, 8]

patient_resampling:
  fraction: 0.80
  count: 500
  random_seed: 20260921

clustering:
  final_linkage: average
  algorithms:
    hierarchical:
      linkage_options: [average, complete]
    spectral:
      assign_labels_options: [kmeans, discretize, cluster_qr]
    kmedoids:
      init_options: [k-medoids++, random, heuristic]

snf:
  neighbor_count: 20
  iterations: 20
  mu: 0.5
  alpha: 1.0
  ct_high_correlation_threshold: 0.95
