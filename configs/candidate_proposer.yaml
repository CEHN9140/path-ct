k_selector:
  llm:
    provider: deepseek
    model_name: deepseek-v4-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0.0
    max_new_tokens: 2048
    json_retries: 1
  prompt_path: agents/prompts/candidate_k_selector.md

clustering:
  repeat_count: 100
  max_clusters: 8
  consensus_linkage: average
  pac_lower: 0.1
  pac_upper: 0.9
  selection_method: llm_consensus_review
  random_seed: 20260614
  min_cluster_size: 10
  algorithms:
    hierarchical:
      linkage_options: [average, complete]
    spectral:
      assign_labels_options: [kmeans, discretize, cluster_qr]
    kmedoids:
      init_options: [k-medoids++, random, heuristic]

snf:
  neighbor_count: 20
  iterations: 20
  mu: 0.5
  alpha: 1.0
  ct_low_variance_threshold: 1.0e-8
  ct_high_correlation_threshold: 0.95
