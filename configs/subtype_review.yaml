llm:
  model_name: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0
  timeout: 120
  max_new_tokens: 4096
  structured_output: json_object
  json_retries: 1

prompt_dir: agents/subtype_review/prompts

budget:
  max_rounds: 10
  max_failures: 3

cross_modal:
  permanova_permutations: 199
  effect_epsilon: 0.001

confounder:
  alpha: 0.05
  categorical_strong_v: 0.50
  numeric_large_cliffs_delta: 0.474
  sparse_permutations: 999

known_label_echo:
  near_identity_ami: 0.80
  near_identity_ari: 0.80
  near_identity_mapping_accuracy: 0.90

cnv:
  alteration_threshold: 0.2

rna:
  min_pathway_overlap: 15
  pathway_gene_sets_path: "/data/qijun/path-ct/tools/msigdb/h.all.v2026.1.Hs.symbols.gmt"
