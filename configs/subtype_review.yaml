llm:
  model_name: deepseek-v4-pro
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0
  timeout: 120
  max_new_tokens: 4096
  router_max_tokens: 256
  verifier_max_tokens: 2048
  reviser_max_tokens: 256
  structured_output: json_object
  json_retries: 2

prompt_dir: agents/subtype_review/prompts

budget:
  max_rounds: 30
  max_failures: 3
  min_split_size: 10
  max_split_children: 2

cross_modal:
  accept_min_supporting_modalities: 2
  split_min_supporting_modalities: 2
  split_require_molecular_or_biology: true
  merge_min_supporting_modalities: 2

confounder:
  alpha: 0.05
  categorical_strong_v: 0.50
  numeric_large_cliffs_delta: 0.474

known_label_echo:
  near_identity_ami: 0.80
  near_identity_ari: 0.80
  near_identity_mapping_accuracy: 0.90
