llm:
  model_name: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0
  timeout: 120
  structured_output: json_object
  json_retries: 1

prompt_dir: agents/subtype_review/prompts

budget:
  max_rounds: 10
  max_failures: 3

cross_modal:
  permanova_permutations: 999
  permdisp_permutations: 999
  lowest_support_patients_to_report: 5
  structure:
    resampling_fraction: 0.8
    resampling_iterations: 200
    pac_lower: 0.1
    pac_upper: 0.9
    random_seed: 0

confounder:
  alpha: 0.05
  categorical_cramers_v_warning: 0.50
  sparse_permutations: 999

known_label_echo:
  assessable_labels:
    - stage
    - grade

cnv:
  alteration_threshold: 0.2

rna:
  min_pathway_overlap: 15
  pathway_gene_sets_path: "/data/qijun/path-ct/tools/msigdb/h.all.v2026.1.Hs.symbols.gmt"
