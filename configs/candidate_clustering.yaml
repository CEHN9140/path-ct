repeat_count: 100
max_clusters: 8
consensus_linkage: average
pac_lower: 0.1
pac_upper: 0.9
selection_method: pac_stability
pac_gain_threshold: 0.05
random_seed: 20260614
min_cluster_size: 10
pac_tie_tolerance: 0.02
algorithms:
  hierarchical:
    linkage_options: [average, complete]
  spectral:
    assign_labels_options: [kmeans, discretize, cluster_qr]
  pam:
    method: pam
    init_options: [k-medoids++, random, heuristic]
